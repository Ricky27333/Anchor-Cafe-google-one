  </defs>
  <rect width="64" height="64" rx="14" fill="url(#oceanNavy)"/>
  <!-- Decorative Ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#anchorGold)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6"/>
