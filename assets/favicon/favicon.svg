      <stop offset="0%" stop-color="#E8DFC8"/>
      <stop offset="50%" stop-color="#C9A86A"/>
      <stop offset="100%" stop-color="#9A7B3E"/>
    </linearGradient>
    <linearGradient id="oceanNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#061527"/>
